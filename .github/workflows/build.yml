name: Build cores

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build-windows --config Release --target mgba_libretro --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            build-windows/mgba/Release/kirby_coop_libretro.dll
            kirby_coop_libretro.info

  android:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - name: Install the tested Android NDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'ndk;23.1.7779620'"
      - name: Configure
        run: >-
          cmake -S . -B build-android -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/23.1.7779620/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=${{ matrix.abi }}
          -DANDROID_PLATFORM=android-21
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-android --target mgba_libretro --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: |
            build-android/mgba/kirby_coop_libretro.so
            kirby_coop_libretro.info
